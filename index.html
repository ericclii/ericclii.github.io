<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eric.</title>
<meta name="description" content="Eric Li.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&display=block">
<link rel="stylesheet" href="assets/site.css">
<style>
  .word {
    position: relative;
    margin: 0;
    /* Oversized: ~58% of a desktop viewport, ~90% of a phone's width. */
    font-size: min(42vw, 44vh);
    line-height: 1;
    letter-spacing: var(--tracking);
    /* Balance the trailing tracking after the period so the word sits centred. */
    padding-left: var(--tracking);
    white-space: nowrap;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  /* The "i": a real, invisible glyph keeps the font's exact advance width and
     baseline, and the glass menu is laid over where its ink would be. */
  .i {
    position: relative;
    display: inline-block;
  }
  .i-glyph { color: transparent; }
  .i-baseline { display: inline-block; width: 0; height: 0; }

  /* Geometry defaults (em) approximate SF Pro Rounded Bold; the script below
     replaces them with the real glyph's measured ink bounds. */
  .menu {
    --stem-x: 0.062em;  --stem-y: 0.26em;  --stem-w: 0.136em;  --stem-h: 0.54em;
    --dot-x: 0.054em;   --dot-y: 0.035em;  --dot-d: 0.152em;
    --icon: 0.52;  /* icon size as a fraction of stem width */
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 1em;
    letter-spacing: 0;
  }

  /* ---------- Liquid glass ---------- */

  /* Animatable angles for the rim's dark streaks and the sheen sweep. */
  @property --rim-angle { syntax: "<angle>"; inherits: false; initial-value: -75deg; }
  @property --sheen-angle { syntax: "<angle>"; inherits: false; initial-value: -45deg; }

  .glass {
    /* Bright glints sit where the glass curves hardest (the rounded ends),
       sized off the glass's width so the pill and the dot match: a hot arc
       over the top-right shoulder, a white bounce along the bottom with an
       iridescent fringe (lavender left, warm gold right). */
    --glint:
      radial-gradient(calc(var(--gw) * .55) calc(var(--gw) * .42) at 72% calc(var(--gw) * .06), #fff 30%, rgba(255,255,255,0)),
      radial-gradient(calc(var(--gw) * .4) calc(var(--gw) * .3) at 50% calc(100% - var(--gw) * .02), #fff 20%, rgba(255,255,255,0)),
      radial-gradient(calc(var(--gw) * .36) calc(var(--gw) * .32) at 18% calc(100% - var(--gw) * .2), rgba(214,196,255,.95), rgba(214,196,255,0)),
      radial-gradient(calc(var(--gw) * .36) calc(var(--gw) * .32) at 84% calc(100% - var(--gw) * .18), rgba(255,226,170,.95), rgba(255,226,170,0));
    --rim: max(1px, calc(var(--gw) * .035));
    position: absolute;
    isolation: isolate;
    border-radius: 999px;
    /* The body darkens slightly toward its edge, like the thick rim of a lens,
       and gathers a caustic along the bottom. */
    background:
      radial-gradient(120% 60% at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.9), rgba(255,255,255,0) 70%),
      radial-gradient(90% calc(var(--gw) * .5) at 50% 100%, rgba(255,255,255,.75), rgba(255,255,255,0)),
      radial-gradient(closest-side, rgba(255,255,255,.75) 50%, rgba(232,232,237,.6) 82%, rgba(205,205,214,.6) 100%),
      linear-gradient(-75deg, rgba(250,250,252,.6), rgba(255,255,255,.8), rgba(244,244,248,.6));
    -webkit-backdrop-filter: blur(14px) saturate(1.8);
    backdrop-filter: blur(14px) saturate(1.8);
    box-shadow:
      /* Thickness: shade under the top lip, light pooling at the bottom. */
      inset 0 calc(var(--gw) * .05) calc(var(--gw) * .05) rgba(0,0,0,.05),
      inset 0 calc(var(--gw) * -.05) calc(var(--gw) * .05) rgba(255,255,255,.6),
      inset 0 0 calc(var(--gw) * .04) calc(var(--gw) * .1) rgba(255,255,255,.25),
      /* Specular hairline along the top-left inner edge. */
      inset 1px 1px 0 rgba(255,255,255,.75),
      0 0 0 0.5px rgba(0,0,0,.1),
      0 calc(var(--gw) * .1) calc(var(--gw) * .05) calc(var(--gw) * -.05) rgba(0,0,0,.18),
      0 calc(var(--gw) * .16) calc(var(--gw) * .5) rgba(0,0,0,.12);
    transition: transform .45s cubic-bezier(.34, 1.56, .64, 1), box-shadow .3s ease;
    will-change: transform;
  }

  /* The rim (::before): bright glints over a half-white ring cut by two
     opposing dark streaks. The streaks are what make the edge read as glass
     on a white page, and they swing round on hover as if the light moved. */
  .glass::before,
  .glint {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    border-radius: inherit;
    padding: var(--rim);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    pointer-events: none;
  }
  .glass::before {
    background:
      var(--glint),
      conic-gradient(from var(--rim-angle) at 50% 50%,
        rgba(0,0,0,.4), rgba(0,0,0,0) 5% 40%,
        rgba(0,0,0,.4) 50%, rgba(0,0,0,0) 60% 95%,
        rgba(0,0,0,.4)),
      linear-gradient(rgba(255,255,255,.5), rgba(255,255,255,.5));
    transition: --rim-angle .5s ease;
  }
  .glass:hover::before { --rim-angle: -125deg; }
  .glass:active::before { --rim-angle: -75deg; }
  /* A wider, blurred copy of the glints that blooms inward off the hot spots. */
  .glint {
    padding: calc(var(--rim) * 2.4);
    background: var(--glint);
    filter: blur(calc(var(--rim) * 1.1));
    opacity: .9;
  }

  /* Sheen (::after): a soft diagonal band of light that slides across on
     hover and tilts on press. */
  .glass::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    border-radius: inherit;
    background: linear-gradient(var(--sheen-angle),
      rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 40% 50%, rgba(255,255,255,0) 55%)
      0% 50% / 200% 200% no-repeat;
    mix-blend-mode: screen;
    pointer-events: none;
    transition: background-position .5s cubic-bezier(.25, 1, .5, 1), --sheen-angle .5s cubic-bezier(.25, 1, .5, 1);
  }
  .glass:hover::after { background-position: 25% 50%; }
  .glass:active::after { background-position: 50% 15%; --sheen-angle: -15deg; }

  @media (hover: none) {
    .glass:hover::before, .glass:active::before { --rim-angle: -75deg; }
  }

  .glass:active { transform: scale(1.06); }

  .stem {
    --gw: var(--stem-w);
    left: var(--stem-x);
    top: var(--stem-y);
    width: var(--stem-w);
    height: var(--stem-h);
    display: flex;
    flex-direction: column;
    padding: calc(var(--stem-w) * .06) 0;
  }
  .dot {
    --gw: var(--dot-d);
    left: var(--dot-x);
    top: var(--dot-y);
    width: var(--dot-d);
    height: var(--dot-d);
  }

  .item {
    position: relative;
    z-index: 3;
    flex: 1;
    display: grid;
    place-items: center;
    color: #3a3a3c;
    border-radius: 999px;
    outline: none;
    transition: color .2s ease, transform .35s cubic-bezier(.34, 1.56, .64, 1);
  }
  .dot .item { position: absolute; inset: 0; }
  .item svg {
    width: calc(var(--stem-w) * var(--icon));
    height: calc(var(--stem-w) * var(--icon));
    overflow: visible;
  }
  .item:active { transform: scale(.9); }
  .item:focus-visible::after {
    content: "";
    position: absolute;
    inset: calc(var(--stem-w) * .08);
    border-radius: 999px;
    box-shadow: 0 0 0 2px #0a84ff;
  }

  /* Selection lens: a small inner glass bubble that follows the pointer and
     rests on the current page, like the iOS tab bar. */
  .lens {
    position: absolute;
    z-index: 1;
    left: calc(var(--stem-w) * .09);
    right: calc(var(--stem-w) * .09);
    top: 0;
    aspect-ratio: 1;
    border-radius: 999px;
    background: rgba(120,120,128,.12);
    box-shadow: inset 0 1px 0.5px rgba(255,255,255,.7);
    transform: translateY(var(--lens-y, 0px));
    transition: transform .5s cubic-bezier(.34, 1.4, .64, 1), opacity .2s ease;
    pointer-events: none;
  }

  /* Hold the menu until it's fitted to the real glyph, then settle in. */
  .js .menu { opacity: 0; transform: scale(.94); }
  .js .menu.ready {
    opacity: 1;
    transform: none;
    transition: opacity .5s ease, transform .7s cubic-bezier(.34, 1.4, .64, 1);
  }

  @media (prefers-reduced-motion: reduce) {
    .glass, .glass::before, .glass::after, .item, .lens, .js .menu.ready { transition: none; }
    .glass:active, .item:active { transform: none; }
  }
</style>
<script>document.documentElement.classList.add('js')</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Drawn after SF Symbols (Regular): person.crop.circle, house, folder,
       doc.text, arrow.down.doc. -->
  <defs>
    <symbol id="sf-person-crop-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9.25"/>
      <circle cx="12" cy="9.6" r="3.3"/>
      <path d="M5.85 18.55c1.35-2.35 3.55-3.65 6.15-3.65s4.8 1.3 6.15 3.65"/>
    </symbol>
    <symbol id="sf-house" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.4 11.4 12 4.1l8.6 7.3"/>
      <path d="M17.6 5.2v2.6"/>
      <path d="M5.9 9.6v9.15c0 .8.65 1.45 1.45 1.45h9.3c.8 0 1.45-.65 1.45-1.45V9.6"/>
      <rect x="10.15" y="14.1" width="3.7" height="6.1" rx=".7" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="sf-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.25 7.3c0-1.05.85-1.9 1.9-1.9h3.9c.55 0 1.05.22 1.42.6l1.28 1.33h7.1c1.05 0 1.9.85 1.9 1.9v8.47c0 1.05-.85 1.9-1.9 1.9H5.15c-1.05 0-1.9-.85-1.9-1.9Z"/>
      <path d="M3.25 10.05h17.5"/>
    </symbol>
    <symbol id="sf-doc-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5.75" y="3.25" width="12.5" height="17.5" rx="2.3"/>
      <path d="M9 8.3h6M9 11.5h6M9 14.7h3.8"/>
    </symbol>
    <symbol id="sf-arrow-down-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.6 3.25H8.05c-1.27 0-2.3 1.03-2.3 2.3v12.9c0 1.27 1.03 2.3 2.3 2.3h7.9c1.27 0 2.3-1.03 2.3-2.3V7.9Z"/>
      <path d="M13.6 3.25v3.4c0 .7.56 1.25 1.25 1.25h3.4"/>
      <path d="M12 10.6v6.3M9.55 14.6 12 17.05l2.45-2.45"/>
    </symbol>
  </defs>
</svg>

<main>
  <h1 class="word" aria-label="Eric.">
    <span aria-hidden="true">Er</span><span class="i"><span class="i-glyph" aria-hidden="true">i</span><span class="i-baseline"></span>
      <nav class="menu" aria-label="Site">
        <div class="glass dot"><span class="glint" aria-hidden="true"></span>
          <a class="item" href="about/" aria-label="About" title="About">
            <svg aria-hidden="true"><use href="#sf-person-crop-circle"/></svg>
          </a>
        </div>
        <div class="glass stem"><span class="glint" aria-hidden="true"></span>
          <span class="lens" aria-hidden="true"></span>
          <a class="item" href="./" aria-label="Home" title="Home" aria-current="page">
            <svg aria-hidden="true"><use href="#sf-house"/></svg>
          </a>
          <a class="item" href="projects/" aria-label="Projects" title="Projects">
            <svg aria-hidden="true"><use href="#sf-folder"/></svg>
          </a>
          <a class="item" href="resume/" aria-label="Resume" title="Resume">
            <svg aria-hidden="true"><use href="#sf-doc-text"/></svg>
          </a>
          <a class="item" href="resume/download/" aria-label="Download resume" title="Download resume">
            <svg aria-hidden="true"><use href="#sf-arrow-down-doc"/></svg>
          </a>
        </div>
      </nav></span><span aria-hidden="true">c.</span>
  </h1>
</main>

<script>
(() => {
  const slot = document.querySelector('.i');
  const glyph = slot.querySelector('.i-glyph');
  const probe = slot.querySelector('.i-baseline');
  const menu = slot.querySelector('.menu');
  const stem = menu.querySelector('.stem');
  const lens = menu.querySelector('.lens');
  const items = [...stem.querySelectorAll('.item')];
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const SS = 2; // supersampling for sub-pixel edges

  // Ink bounds of a run of rows/columns, with fractional (anti-aliased) edges.
  function span(sums, from, to) {
    let a = from, b = to, peak = 0;
    for (let k = from; k <= to; k++) peak = Math.max(peak, sums[k]);
    while (a < b && sums[a] < peak * .02) a++;
    while (b > a && sums[b] < peak * .02) b--;
    return [a + 1 - Math.min(1, sums[a] / peak), b + Math.min(1, sums[b] / peak)];
  }

  // Rasterise the real "i" and find its stem and tittle.
  function measureGlyph(cs, size) {
    const s = size * SS;
    const pad = Math.ceil(s * .25);
    canvas.width = Math.ceil(s * .6) + pad * 2;
    canvas.height = Math.ceil(s * 1.5);
    const baseline = Math.ceil(s * 1.15);
    ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${s}px ${cs.fontFamily}`;
    ctx.fillStyle = '#000';
    ctx.fillText('i', pad, baseline);
    const advance = ctx.measureText('i').width / SS;

    const { data, width, height } = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const rows = new Float64Array(height);
    for (let y = 0; y < height; y++)
      for (let x = 0; x < width; x++) rows[y] += data[(y * width + x) * 4 + 3] / 255;

    // Contiguous inked row runs: expect [tittle, stem].
    const runs = [];
    for (let y = 0; y < height; y++) {
      if (rows[y] > .5 && (y === 0 || rows[y - 1] <= .5)) runs.push([y, y]);
      if (rows[y] > .5) runs[runs.length - 1][1] = y;
    }
    if (runs.length < 2) return null;

    const box = ([r0, r1]) => {
      const cols = new Float64Array(width);
      for (let y = r0; y <= r1; y++)
        for (let x = 0; x < width; x++) cols[x] += data[(y * width + x) * 4 + 3] / 255;
      let c0 = 0, c1 = width - 1;
      while (c0 < c1 && cols[c0] === 0) c0++;
      while (c1 > c0 && cols[c1] === 0) c1--;
      const [top, bottom] = span(rows, Math.max(0, r0 - 1), Math.min(height - 1, r1 + 1));
      const [left, right] = span(cols, c0, c1);
      return {
        x: (left - pad) / SS, y: (top - baseline) / SS,
        w: (right - left) / SS, h: (bottom - top) / SS,
      };
    };
    return { advance, dot: box(runs[0]), stem: box(runs[runs.length - 1]) };
  }

  function fit() {
    const cs = getComputedStyle(slot);
    const size = parseFloat(cs.fontSize);
    const m = measureGlyph(cs, size);
    const domAdvance = glyph.getBoundingClientRect().width - (parseFloat(cs.letterSpacing) || 0);

    // If the canvas didn't render the same face as the page (e.g. a browser
    // that won't resolve `ui-rounded` on canvas), keep the CSS defaults.
    if (m && Math.abs(m.advance - domAdvance) / domAdvance < .03) {
      const base = probe.getBoundingClientRect().top - slot.getBoundingClientRect().top;
      const d = Math.max(m.dot.w, m.dot.h);
      const set = (k, v) => menu.style.setProperty(k, v.toFixed(2) + 'px');
      set('--stem-x', m.stem.x);
      set('--stem-y', base + m.stem.y);
      set('--stem-w', m.stem.w);
      set('--stem-h', m.stem.h);
      set('--dot-x', m.dot.x + (m.dot.w - d) / 2);
      set('--dot-y', base + m.dot.y + (m.dot.h - d) / 2);
      set('--dot-d', d);
    }
    moveLens(items.find(a => a.hasAttribute('aria-current')) || items[0]);
    menu.classList.add('ready');
  }

  function moveLens(item) {
    const offset = item.offsetTop + (item.offsetHeight - lens.offsetHeight) / 2;
    lens.style.setProperty('--lens-y', offset + 'px');
  }

  items.forEach(a => {
    a.addEventListener('pointerenter', () => moveLens(a));
    a.addEventListener('focus', () => moveLens(a));
  });
  stem.addEventListener('pointerleave', () =>
    moveLens(items.find(a => a.hasAttribute('aria-current')) || items[0]));

  // Specular highlight tracks the pointer across each piece of glass.
  menu.querySelectorAll('.glass').forEach(g => {
    g.addEventListener('pointermove', e => {
      const r = g.getBoundingClientRect();
      g.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
      g.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
    });
    g.addEventListener('pointerleave', () => {
      g.style.removeProperty('--mx');
      g.style.removeProperty('--my');
    });
  });

  let frame;
  addEventListener('resize', () => {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(fit);
  });
  document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
